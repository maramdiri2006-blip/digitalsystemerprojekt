<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hjemmemåling</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Hjemmemåling</h1>
    </header>

    <main class="maram-maaleoversigt">

        <button class="tilbage-knap"
                onclick="window.location.href='2-registrering-af-hjemmemaaling.html'">
            Tilbage
        </button>

        <h2>Mine målinger</h2>
        <p>Her kan du se dine registrerede hjemmemålinger.</p>

        <div class="seneste-maaling">

            <h3>Seneste måling</h3>

            <p>
                <strong>Dato og tidspunkt:</strong>
                <span id="visDato">4. oktober 2025 kl. 08.00</span>
            </p>

            <div class="maalinger">

                <div class="maaling">
                    <p>Systolisk blodtryk</p>
                    <strong id="visSystolisk">120</strong>
                    <p>mmHg</p>
                </div>

                <div class="maaling">
                    <p>Diastolisk blodtryk</p>
                    <strong id="visDiastolisk">80</strong>
                    <p>mmHg</p>
                </div>

                <div class="maaling">
                    <p>Puls</p>
                    <strong id="visPuls">72</strong>
                    <p>slag/min</p>
                </div>

            </div>

            <p>
                <strong>Symptomer:</strong>
                <span id="visSymptomer">Ingen symptomer</span>
            </p>

            <p>
                <strong>Hvordan har du det?:</strong>
                <span id="visTilstand">God</span>
            </p>

            <p>
                <strong>Note:</strong>
                <span id="visNote">Ingen note</span>
            </p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
