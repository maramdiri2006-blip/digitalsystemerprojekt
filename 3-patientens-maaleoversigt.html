<!DOCTYPE html>
<html lang="da">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patientens måleoversigt</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Hjemmemåling</h1>
    </header>

    <main class="registrering">

        <h2>Mine målinger</h2>
        <p>Her kan du se din seneste hjemmemåling.</p>

        <div class="seneste-maaling">

            <h3>Seneste måling</h3>

            <p>
                <strong>Dato og tidspunkt:</strong>
                <span id="visDato">Ingen måling registreret</span>
            </p>

            <div class="maalinger">

                <div class="maaling">
                    <p>Systolisk blodtryk</p>
                    <strong id="visSystolisk">-</strong>
                    <p>mmHg</p>
                </div>

                <div class="maaling">
                    <p>Diastolisk blodtryk</p>
                    <strong id="visDiastolisk">-</strong>
                    <p>mmHg</p>
                </div>

                <div class="maaling">
                    <p>Puls</p>
                    <strong id="visPuls">-</strong>
                    <p>slag/min</p>
                </div>

            </div>

            <p>
                <strong>Symptomer:</strong>
                <span id="visSymptomer">Ingen symptomer</span>
            </p>

            <p>
                <strong>Hvordan har du det?:</strong>
                <span id="visTilstand">-</span>
            </p>

            <p>
                <strong>Note:</strong>
                <span id="visNote">Ingen note</span>
            </p>

        </div>

        <button type="button"
                onclick="window.location.href='2-registrering-af-hjemmemaaling.html'">
            Registrer ny måling
        </button>

    </main>

    <script src="script.js"></script>

</body>
</html>
